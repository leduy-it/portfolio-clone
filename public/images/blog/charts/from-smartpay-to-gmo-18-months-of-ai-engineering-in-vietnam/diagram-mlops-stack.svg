<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace">
  <title id="title">MLOps stack at SmartPay then GMO</title>
  <desc id="desc">Diagram of the MLOps stack as experienced from inside, with annotations for boxes that no one applauds.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-lime" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#bef264"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="40" y="34" fill="#e2e8f0" font-size="16" font-weight="600">the MLOps stack, as experienced</text>
  <text x="40" y="52" fill="#64748b" font-size="11">grey boxes get the demo. lime boxes get the on-call pager. Sculley et al. (2015) called these "hidden technical debt".</text>

  <!-- Layer labels (left rail) -->
  <g fill="#475569" font-size="10" text-anchor="end">
    <text x="36" y="120">data</text>
    <text x="36" y="210">model</text>
    <text x="36" y="300">serving</text>
    <text x="36" y="390">ops</text>
  </g>

  <!-- Row 1: data ingestion -->
  <g>
    <rect x="50" y="90" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="135" y="118" fill="#e2e8f0" font-size="12" text-anchor="middle">data ingestion</text>
    <text x="135" y="135" fill="#94a3b8" font-size="10" text-anchor="middle">scans, txns, forms</text>
    <text x="135" y="170" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <g>
    <rect x="240" y="90" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="325" y="118" fill="#e2e8f0" font-size="12" text-anchor="middle">feature freshness</text>
    <text x="325" y="135" fill="#94a3b8" font-size="10" text-anchor="middle">windows, lag, joins</text>
    <text x="325" y="170" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <g>
    <rect x="430" y="90" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="515" y="118" fill="#e2e8f0" font-size="12" text-anchor="middle">dataset hygiene</text>
    <text x="515" y="135" fill="#94a3b8" font-size="10" text-anchor="middle">labels, dedup, drift</text>
    <text x="515" y="170" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">data cascades live here</text>
  </g>

  <g>
    <rect x="620" y="90" width="170" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="705" y="118" fill="#e2e8f0" font-size="12" text-anchor="middle">notebook / EDA</text>
    <text x="705" y="135" fill="#94a3b8" font-size="10" text-anchor="middle">the demo lives here</text>
    <text x="705" y="170" fill="#f97316" font-size="9" text-anchor="middle" font-style="italic">applause</text>
  </g>

  <!-- Row 2: model layer -->
  <g>
    <rect x="50" y="190" width="170" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="135" y="218" fill="#e2e8f0" font-size="12" text-anchor="middle">training job</text>
    <text x="135" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">backbone, fine-tune</text>
    <text x="135" y="270" fill="#f97316" font-size="9" text-anchor="middle" font-style="italic">applause</text>
  </g>

  <g>
    <rect x="240" y="190" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="325" y="218" fill="#e2e8f0" font-size="12" text-anchor="middle">model registry</text>
    <text x="325" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">versions, lineage</text>
    <text x="325" y="270" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <g>
    <rect x="430" y="190" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="515" y="218" fill="#e2e8f0" font-size="12" text-anchor="middle">retraining loop</text>
    <text x="515" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">cadence, triggers</text>
    <text x="515" y="270" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <g>
    <rect x="620" y="190" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="705" y="218" fill="#e2e8f0" font-size="12" text-anchor="middle">eval harness</text>
    <text x="705" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">slice metrics, ML test score</text>
    <text x="705" y="270" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <!-- Row 3: serving layer -->
  <g>
    <rect x="50" y="290" width="170" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="135" y="318" fill="#e2e8f0" font-size="12" text-anchor="middle">inference API</text>
    <text x="135" y="335" fill="#94a3b8" font-size="10" text-anchor="middle">latency budget</text>
  </g>

  <g>
    <rect x="240" y="290" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="325" y="318" fill="#e2e8f0" font-size="12" text-anchor="middle">drift monitoring</text>
    <text x="325" y="335" fill="#94a3b8" font-size="10" text-anchor="middle">slices, long tail</text>
    <text x="325" y="370" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <g>
    <rect x="430" y="290" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="515" y="318" fill="#e2e8f0" font-size="12" text-anchor="middle">human review flow</text>
    <text x="515" y="335" fill="#94a3b8" font-size="10" text-anchor="middle">queues, escalation</text>
    <text x="515" y="370" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <g>
    <rect x="620" y="290" width="170" height="60" rx="6" fill="#0f172a" stroke="#bef264" stroke-width="1.8"/>
    <text x="705" y="318" fill="#e2e8f0" font-size="12" text-anchor="middle">on-call rotation</text>
    <text x="705" y="335" fill="#94a3b8" font-size="10" text-anchor="middle">3 days before Tết</text>
    <text x="705" y="370" fill="#bef264" font-size="9" text-anchor="middle" font-style="italic">no applause</text>
  </g>

  <!-- Right side: enterprise / customer (shows "outside view") -->
  <g>
    <rect x="810" y="190" width="135" height="160" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="877" y="220" fill="#f97316" font-size="11" text-anchor="middle" font-weight="600">customer</text>
    <text x="877" y="245" fill="#94a3b8" font-size="9" text-anchor="middle">bank ops, BPO,</text>
    <text x="877" y="259" fill="#94a3b8" font-size="9" text-anchor="middle">field agents</text>
    <text x="877" y="288" fill="#cbd5e1" font-size="9" text-anchor="middle">"does it answer</text>
    <text x="877" y="302" fill="#cbd5e1" font-size="9" text-anchor="middle">on a tired Tuesday?"</text>
  </g>

  <!-- Arrows: data flow (left to right within rows) -->
  <line x1="220" y1="120" x2="240" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="120" x2="430" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="120" x2="620" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="220" y1="220" x2="240" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="220" x2="430" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="220" x2="620" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="220" y1="320" x2="240" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="320" x2="430" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="320" x2="620" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Vertical: from data row down to model row -->
  <line x1="135" y1="150" x2="135" y2="190" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="325" y1="150" x2="325" y2="190" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="515" y1="150" x2="515" y2="190" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Vertical: from model row to serving row -->
  <line x1="325" y1="250" x2="325" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="515" y1="250" x2="515" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="705" y1="250" x2="705" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Feedback loop: drift monitoring -> retraining loop (back-arrow, lime) -->
  <path d="M 325 290 C 325 270, 460 270, 460 250" fill="none" stroke="#bef264" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-lime)"/>
  <text x="372" y="277" fill="#bef264" font-size="9" font-style="italic">retrain trigger</text>

  <!-- Customer -> on-call -->
  <line x1="810" y1="320" x2="790" y2="320" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="40" y="450" fill="#64748b" font-size="10" font-style="italic">Boxes outlined in lime are where most of the eighteen months actually went. The notebook gets the screenshot.</text>
  <text x="40" y="465" fill="#64748b" font-size="10" font-style="italic">Compare: Kreuzberger et al. (2023) MLOps reference architecture; Breck et al. (2017) ML Test Score rubric.</text>
</svg>
