<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace">
  <title id="title">Vietnam AI engineering context — radar</title>
  <desc id="desc">Radar chart showing five qualitative axes describing the Vietnam AI engineering context, each scored 0 to 10 (illustrative).</desc>

  <rect width="960" height="480" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="40" y="34" fill="#e2e8f0" font-size="16" font-weight="600">Vietnam AI engineering, by feel</text>
  <text x="40" y="52" fill="#64748b" font-size="11">five axes, 0–10. illustrative — drawn from inside the work, not from a survey.</text>

  <!-- Radar centered at (340, 270) -->
  <g transform="translate(340 270)">
    <!-- Concentric pentagons (5 axes => 5-gon) -->
    <!-- Axis count = 5; angle step = 72 deg, starting from -90 (top) -->
    <!-- vertices at radius r:  for i in 0..4: angle = -90 + 72*i -->
    <!-- precomputed: 0:(0,-r) 1:(0.951r,-0.309r) 2:(0.588r,0.809r) 3:(-0.588r,0.809r) 4:(-0.951r,-0.309r) -->

    <!-- ring 10 (outer) r=180 -->
    <polygon points="0,-180 171.18,-55.62 105.84,145.62 -105.84,145.62 -171.18,-55.62"
             fill="none" stroke="#1f2937" stroke-width="1"/>
    <!-- ring 8 r=144 -->
    <polygon points="0,-144 136.94,-44.50 84.67,116.50 -84.67,116.50 -136.94,-44.50"
             fill="none" stroke="#1f2937" stroke-width="1"/>
    <!-- ring 6 r=108 -->
    <polygon points="0,-108 102.71,-33.37 63.50,87.37 -63.50,87.37 -102.71,-33.37"
             fill="none" stroke="#1f2937" stroke-width="1"/>
    <!-- ring 4 r=72 -->
    <polygon points="0,-72 68.47,-22.25 42.34,58.25 -42.34,58.25 -68.47,-22.25"
             fill="none" stroke="#1f2937" stroke-width="1"/>
    <!-- ring 2 r=36 -->
    <polygon points="0,-36 34.24,-11.12 21.17,29.12 -21.17,29.12 -34.24,-11.12"
             fill="none" stroke="#1f2937" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="0" x2="171.18" y2="-55.62" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="0" x2="105.84" y2="145.62" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="0" x2="-105.84" y2="145.62" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="0" x2="-171.18" y2="-55.62" stroke="#334155" stroke-width="1"/>

    <!-- Tick value (mid ring '5') -->
    <text x="4" y="-88" fill="#475569" font-size="9">5</text>
    <text x="4" y="-178" fill="#475569" font-size="9">10</text>

    <!-- Data polygon
         budget pressure (top): 9         -> r=162  -> (0, -162)
         deadline pressure (top-right): 9 -> r=162  -> (154.06, -50.06)
         customer expectations (bot-r): 8 -> r=144  -> (84.67, 116.50)
         talent pool (bot-l): 5           -> r=90   -> (-52.92, 72.81)
         infra access (top-l): 6          -> r=108  -> (-102.71, -33.37)
    -->
    <polygon points="0,-162 154.06,-50.06 84.67,116.50 -52.92,72.81 -102.71,-33.37"
             fill="#bef264" fill-opacity="0.18" stroke="#bef264" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Data points -->
    <circle cx="0" cy="-162" r="4" fill="#bef264"/>
    <circle cx="154.06" cy="-50.06" r="4" fill="#bef264"/>
    <circle cx="84.67" cy="116.50" r="4" fill="#bef264"/>
    <circle cx="-52.92" cy="72.81" r="4" fill="#bef264"/>
    <circle cx="-102.71" cy="-33.37" r="4" fill="#bef264"/>

    <!-- Axis labels (placed beyond outer ring) -->
    <g fill="#e2e8f0" font-size="12" text-anchor="middle">
      <text x="0" y="-200">budget pressure</text>
      <text x="205" y="-65">deadline pressure</text>
      <text x="135" y="180">customer expectations</text>
      <text x="-135" y="180">talent pool</text>
      <text x="-205" y="-65">infra access</text>
    </g>

    <!-- Score labels next to vertices -->
    <g fill="#bef264" font-size="11" text-anchor="middle">
      <text x="-18" y="-160">9</text>
      <text x="170" y="-44">9</text>
      <text x="98" y="135">8</text>
      <text x="-66" y="86">5</text>
      <text x="-115" y="-26">6</text>
    </g>
  </g>

  <!-- Right-side qualitative captions -->
  <g transform="translate(620 90)">
    <rect x="0" y="0" width="305" height="320" fill="#0f172a" stroke="#1e293b" rx="6"/>

    <text x="20" y="30" fill="#e2e8f0" font-size="12" font-weight="600">what each axis feels like</text>

    <!-- entries -->
    <g font-size="11" fill="#cbd5e1">
      <circle cx="22" cy="62" r="4" fill="#bef264"/>
      <text x="34" y="65">budget pressure — every GPU hour is argued</text>
      <text x="34" y="80" fill="#64748b" font-size="10">spot instances, mixed-precision, distillation</text>

      <circle cx="22" cy="112" r="4" fill="#bef264"/>
      <text x="34" y="115">deadline pressure — pilots ship under quarter-end</text>
      <text x="34" y="130" fill="#64748b" font-size="10">"3 days before Tết" is a real release window</text>

      <circle cx="22" cy="162" r="4" fill="#bef264"/>
      <text x="34" y="165">customer expectations — enterprise SLAs</text>
      <text x="34" y="180" fill="#64748b" font-size="10">banks, BPOs, government — they want throughput</text>

      <circle cx="22" cy="212" r="4" fill="#bef264"/>
      <text x="34" y="215">talent pool — deepening, still uneven</text>
      <text x="34" y="230" fill="#64748b" font-size="10">strong juniors, fewer senior production hands</text>

      <circle cx="22" cy="262" r="4" fill="#bef264"/>
      <text x="34" y="265">infra access — scrappy but workable</text>
      <text x="34" y="280" fill="#64748b" font-size="10">cloud credits, regional zones, on-prem hybrids</text>
    </g>

    <text x="20" y="305" fill="#475569" font-size="9" font-style="italic">illustrative; aligned with public industry reporting (MIC, 2023).</text>
  </g>
</svg>
