<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
  <title id="title">Customer trust vs response time — the silence threshold cliff</title>
  <desc id="desc">Qualitative trust on the y-axis decreases as response time grows on the log-scale x-axis. Trust is high under 400ms (Doherty threshold), declines gently to about one second, then cliffs after roughly three seconds where conversational silence enters. Markers show the position before and after the optimization.</desc>

  <!-- Background -->
  <rect width="960" height="480" fill="#0e0e10"/>

  <!-- Heading -->
  <g fill="#fafafa">
    <text x="80" y="40" font-size="18" font-weight="700">trust vs response time — where silence enters</text>
    <text x="80" y="60" font-size="11" fill="#a1a1aa">qualitative; x axis log scale; thresholds adapted from Doherty (1982) and conversational latency research</text>
  </g>

  <!-- Frame -->
  <g stroke="#27272a" stroke-width="1">
    <line x1="100" y1="100" x2="100" y2="400"/>
    <line x1="100" y1="400" x2="900" y2="400"/>
  </g>

  <!--
    X axis log scale from 0.1s to 30s
    log10(0.1)=-1, log10(30)=1.477; total span = 2.477
    x_pixel = 100 + ( (log10(t) - (-1)) / 2.477 ) * 800

    helpers (computed):
    0.1s  -> 100
    0.2s  -> 200.5  (log = -0.699)
    0.4s  -> 296.2
    1s    -> 423.0
    2s    -> 520.0
    3s    -> 577.0
    5s    -> 649.0
    10s   -> 746.0
    20s   -> 843.0
    30s   -> 900.0
  -->

  <!-- Y axis grid + qualitative labels -->
  <g font-size="10" fill="#52525b">
    <g stroke="#1f1f23" stroke-dasharray="2 4">
      <line x1="100" y1="160" x2="900" y2="160"/>
      <line x1="100" y1="220" x2="900" y2="220"/>
      <line x1="100" y1="280" x2="900" y2="280"/>
      <line x1="100" y1="340" x2="900" y2="340"/>
    </g>
    <text x="92" y="104" text-anchor="end" fill="#a1a1aa">flow</text>
    <text x="92" y="164" text-anchor="end">trust</text>
    <text x="92" y="224" text-anchor="end">patience</text>
    <text x="92" y="284" text-anchor="end">doubt</text>
    <text x="92" y="344" text-anchor="end">defection</text>
    <text x="92" y="404" text-anchor="end" fill="#a1a1aa">abandon</text>
    <text x="40" y="252" text-anchor="middle" transform="rotate(-90 40 252)" fill="#71717a">customer trust (qualitative)</text>
  </g>

  <!-- X axis ticks (log) -->
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <line x1="100" y1="400" x2="100" y2="404" stroke="#52525b"/>
    <text x="100" y="418">100ms</text>
    <line x1="296" y1="400" x2="296" y2="404" stroke="#52525b"/>
    <text x="296" y="418">400ms</text>
    <line x1="423" y1="400" x2="423" y2="404" stroke="#52525b"/>
    <text x="423" y="418">1s</text>
    <line x1="520" y1="400" x2="520" y2="404" stroke="#52525b"/>
    <text x="520" y="418">2s</text>
    <line x1="577" y1="400" x2="577" y2="404" stroke="#52525b"/>
    <text x="577" y="418">3s</text>
    <line x1="649" y1="400" x2="649" y2="404" stroke="#52525b"/>
    <text x="649" y="418">5s</text>
    <line x1="746" y1="400" x2="746" y2="404" stroke="#52525b"/>
    <text x="746" y="418">10s</text>
    <line x1="843" y1="400" x2="843" y2="404" stroke="#52525b"/>
    <text x="843" y="418">20s</text>
    <text x="500" y="436" fill="#a1a1aa">end-to-end response time (log scale)</text>
  </g>

  <!-- "silence enters" zone after ~3s -->
  <g>
    <rect x="577" y="100" width="323" height="300" fill="#f97316" fill-opacity="0.06"/>
    <line x1="577" y1="100" x2="577" y2="400" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>
    <text x="585" y="118" font-size="11" font-weight="700" fill="#f97316">silence enters</text>
    <text x="585" y="132" font-size="10" fill="#fb923c">conversational pause becomes audible</text>
  </g>

  <!-- Doherty threshold band -->
  <g>
    <line x1="296" y1="100" x2="296" y2="400" stroke="#bef264" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <text x="304" y="118" font-size="11" font-weight="700" fill="#bef264">Doherty · 400ms</text>
    <text x="304" y="132" font-size="10" fill="#a3e635">productivity cliff (1982)</text>
  </g>

  <!-- Trust curve (smooth decline then cliff)
       Path samples (x, y):
       (100, 108) flow
       (200, 122)
       (296, 150) ~Doherty
       (423, 198) trust->patience
       (520, 240)
       (577, 268) silence threshold
       (620, 320) sharp drop
       (680, 360)
       (746, 380)
       (843, 392)
       (900, 396)
  -->
  <g>
    <path d="M 100 108 C 180 112, 240 130, 296 150 S 380 184, 423 198 C 470 218, 510 232, 520 240 C 550 250, 568 258, 577 268 C 595 290, 612 314, 620 320 C 650 348, 700 370, 746 380 C 800 388, 860 394, 900 396"
          fill="none" stroke="#e4e4e7" stroke-width="2.4"/>
    <!-- glow under the curve -->
    <path d="M 100 108 C 180 112, 240 130, 296 150 S 380 184, 423 198 C 470 218, 510 232, 520 240 C 550 250, 568 258, 577 268 C 595 290, 612 314, 620 320 C 650 348, 700 370, 746 380 C 800 388, 860 394, 900 396 L 900 400 L 100 400 Z"
          fill="#e4e4e7" fill-opacity="0.04"/>
  </g>

  <!-- BEFORE marker @ ~5s p99 -->
  <g>
    <circle cx="649" cy="338" r="9" fill="#f97316" stroke="#0e0e10" stroke-width="2"/>
    <line x1="649" y1="338" x2="690" y2="280" stroke="#f97316" stroke-width="1"/>
    <rect x="690" y="262" width="180" height="36" fill="#0e0e10" stroke="#f97316" rx="4"/>
    <text x="700" y="278" font-size="11" font-weight="700" fill="#f97316">before · p99 ≈ 5.1s</text>
    <text x="700" y="292" font-size="10" fill="#fb923c">deep in the silence zone</text>
  </g>

  <!-- AFTER marker @ ~3s p99 -->
  <g>
    <circle cx="577" cy="268" r="9" fill="#60a5fa" stroke="#0e0e10" stroke-width="2"/>
    <line x1="577" y1="268" x2="430" y2="220" stroke="#60a5fa" stroke-width="1"/>
    <rect x="250" y="200" width="180" height="36" fill="#0e0e10" stroke="#60a5fa" rx="4"/>
    <text x="260" y="216" font-size="11" font-weight="700" fill="#60a5fa">after · p99 ≈ 3.0s</text>
    <text x="260" y="230" font-size="10" fill="#93c5fd">at the edge — but back in the room</text>
  </g>

  <!-- Movement arrow -->
  <g>
    <path d="M 645 332 Q 610 310 581 272" fill="none" stroke="#bef264" stroke-width="1.4" stroke-dasharray="3 3"/>
    <polygon points="581,272 587,278 590,270" fill="#bef264"/>
    <text x="600" y="354" font-size="11" font-weight="700" fill="#bef264">~40% faster</text>
  </g>

  <!-- Footnote -->
  <g font-size="10" fill="#52525b">
    <text x="80" y="468">Curve is qualitative. Doherty &amp; Thadhani (1982) describe the 400ms productivity cliff; conversational research notes audible pauses past ~2–3s.</text>
  </g>
</svg>
