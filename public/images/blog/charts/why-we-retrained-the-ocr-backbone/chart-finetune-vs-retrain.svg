<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
  <title id="title">Fine-tuning ceiling vs retraining trajectory across data-difficulty quartiles</title>
  <desc id="desc">Two-line chart. The fine-tune line rises through Q1 and Q2 then flattens by Q3 and dips slightly at Q4. The retrain line rises more slowly at Q1 but maintains slope through the hardest quartile.</desc>

  <!-- Background -->
  <rect width="960" height="480" fill="#0e0e10"/>

  <!-- Title block -->
  <g fill="#fafafa">
    <text x="80" y="44" font-size="18" font-weight="700">accuracy by document-difficulty quartile</text>
    <text x="80" y="64" font-size="11" fill="#a1a1aa">illustrative trajectories — internal eval, normalised scale, no fabricated leaderboard numbers</text>
  </g>

  <!-- Plot frame -->
  <g stroke="#27272a" stroke-width="1">
    <line x1="100" y1="100" x2="100" y2="400"/>
    <line x1="100" y1="400" x2="900" y2="400"/>
  </g>

  <!-- Grid -->
  <g stroke="#1f1f23" stroke-dasharray="2 4">
    <line x1="100" y1="340" x2="900" y2="340"/>
    <line x1="100" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="220" x2="900" y2="220"/>
    <line x1="100" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="100" x2="900" y2="100"/>
    <line x1="300" y1="100" x2="300" y2="400"/>
    <line x1="500" y1="100" x2="500" y2="400"/>
    <line x1="700" y1="100" x2="700" y2="400"/>
  </g>

  <!-- Y axis labels -->
  <g font-size="11" fill="#52525b" text-anchor="end">
    <text x="92" y="404">low</text>
    <text x="92" y="344">·</text>
    <text x="92" y="284">·</text>
    <text x="92" y="224">·</text>
    <text x="92" y="164">·</text>
    <text x="92" y="104">high</text>
  </g>
  <g font-size="10" fill="#52525b">
    <text x="84" y="252" text-anchor="middle" transform="rotate(-90 84 252)">field-level accuracy (relative)</text>
  </g>

  <!-- X axis labels -->
  <g font-size="11" fill="#d4d4d8" text-anchor="middle">
    <text x="200" y="422">Q1 — clean</text>
    <text x="400" y="422">Q2 — typical</text>
    <text x="600" y="422">Q3 — noisy</text>
    <text x="800" y="422">Q4 — worst-case</text>
  </g>
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <text x="200" y="438">curated scans</text>
    <text x="400" y="438">desk photos</text>
    <text x="600" y="438">phone, fluorescent</text>
    <text x="800" y="438">folded, faxed, faded</text>
  </g>

  <!--
    Fine-tune line — rises early, flattens, dips at Q4
    points (x,y): Q1=200,160  Q2=400,140  Q3=600,180  Q4=800,260
  -->
  <g>
    <path d="M 200 160 C 280 145, 320 135, 400 140 C 480 145, 540 165, 600 180 C 660 195, 740 235, 800 260"
          fill="none" stroke="#71717a" stroke-width="2.5" stroke-dasharray="6 5"/>
    <g fill="#a1a1aa">
      <circle cx="200" cy="160" r="5"/>
      <circle cx="400" cy="140" r="5"/>
      <circle cx="600" cy="180" r="5"/>
      <circle cx="800" cy="260" r="5"/>
    </g>
  </g>

  <!--
    Retrain line — slower start, maintains slope, beats fine-tune by Q3
    points: Q1=200,180  Q2=400,150  Q3=600,140  Q4=800,150
  -->
  <g>
    <path d="M 200 180 C 280 170, 320 158, 400 150 C 480 142, 540 140, 600 140 C 660 140, 740 144, 800 150"
          fill="none" stroke="#bef264" stroke-width="3"/>
    <g fill="#bef264">
      <circle cx="200" cy="180" r="6"/>
      <circle cx="400" cy="150" r="6"/>
      <circle cx="600" cy="140" r="6"/>
      <circle cx="800" cy="150" r="6"/>
    </g>
  </g>

  <!-- Annotation: ceiling -->
  <g font-size="10" fill="#a1a1aa">
    <line x1="600" y1="180" x2="600" y2="118" stroke="#3f3f46" stroke-dasharray="2 3"/>
    <text x="608" y="116">ceiling shows up here ↑</text>
    <text x="608" y="130" fill="#71717a">parameter-only updates run out of slope</text>
  </g>

  <!-- Annotation: retrain holds -->
  <g font-size="10" fill="#bef264">
    <line x1="800" y1="150" x2="850" y2="118" stroke="#3f3f46" stroke-dasharray="2 3"/>
    <text x="900" y="116" text-anchor="end">retrain holds slope ↗</text>
    <text x="900" y="130" text-anchor="end" fill="#a3e635">representation is doing the work, not parameters</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#d4d4d8">
    <rect x="650" y="60" width="14" height="3" fill="#bef264"/>
    <text x="672" y="64">retrained backbone</text>
    <rect x="800" y="60" width="14" height="3" fill="#a1a1aa"/>
    <text x="822" y="64">fine-tuned backbone</text>
  </g>
</svg>
