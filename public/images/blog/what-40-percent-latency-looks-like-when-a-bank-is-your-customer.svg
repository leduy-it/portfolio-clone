<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="lat-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1219"/>
      <stop offset="1" stop-color="#0f1c28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#lat-bg)"/>

  <!-- Title -->
  <g font-family="JetBrains Mono, monospace">
    <text x="80" y="80" fill="#8c9cac" font-size="14">// p99 latency, ms</text>
    <text x="80" y="120" fill="#66fcf1" font-size="34" font-weight="700">Inference latency</text>
    <text x="80" y="160" fill="#ff9933" font-size="22">↓ ~40% across the long tail</text>
  </g>

  <!-- Y-axis -->
  <g stroke="#1c2d3e" stroke-width="1">
    <line x1="120" y1="220" x2="120" y2="580"/>
    <line x1="120" y1="580" x2="1140" y2="580"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#8c9cac">
    <text x="80" y="225" text-anchor="end">2400</text>
    <text x="80" y="300" text-anchor="end">1800</text>
    <text x="80" y="375" text-anchor="end">1200</text>
    <text x="80" y="450" text-anchor="end">600</text>
    <text x="80" y="585" text-anchor="end">0</text>
  </g>

  <!-- Ghost bars (before) -->
  <g fill="#66fcf1" opacity="0.18">
    <rect x="180" y="320" width="120" height="260"/>
    <rect x="340" y="280" width="120" height="300"/>
    <rect x="500" y="260" width="120" height="320"/>
    <rect x="660" y="240" width="120" height="340"/>
    <rect x="820" y="225" width="120" height="355"/>
    <rect x="980" y="220" width="120" height="360"/>
  </g>
  <!-- Ghost bar tops marked -->
  <g stroke="#66fcf1" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" fill="none">
    <line x1="180" y1="320" x2="300" y2="320"/>
    <line x1="340" y1="280" x2="460" y2="280"/>
    <line x1="500" y1="260" x2="620" y2="260"/>
    <line x1="660" y1="240" x2="780" y2="240"/>
    <line x1="820" y1="225" x2="940" y2="225"/>
    <line x1="980" y1="220" x2="1100" y2="220"/>
  </g>

  <!-- New bars (after — amber) -->
  <g fill="#ff9933">
    <rect x="180" y="430" width="120" height="150"/>
    <rect x="340" y="390" width="120" height="190"/>
    <rect x="500" y="380" width="120" height="200"/>
    <rect x="660" y="360" width="120" height="220"/>
    <rect x="820" y="350" width="120" height="230"/>
    <rect x="980" y="345" width="120" height="235"/>
  </g>

  <!-- Bar labels -->
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#8c9cac" text-anchor="middle">
    <text x="240" y="610">p50</text>
    <text x="400" y="610">p75</text>
    <text x="560" y="610">p90</text>
    <text x="720" y="610">p95</text>
    <text x="880" y="610">p99</text>
    <text x="1040" y="610">p99.9</text>
  </g>

  <!-- Legend -->
  <g font-family="JetBrains Mono, monospace" font-size="12">
    <rect x="900" y="100" width="14" height="14" fill="#66fcf1" opacity="0.25"/>
    <text x="922" y="112" fill="#66fcf1">before</text>
    <rect x="900" y="125" width="14" height="14" fill="#ff9933"/>
    <text x="922" y="137" fill="#ff9933">after</text>
  </g>

  <!-- Caption bottom-left: customer call moment -->
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#8c9cac">
    <text x="80" y="650">$ tail -f /var/log/ocr.log  ·  one. two. three. — and then they stopped counting.</text>
  </g>
</svg>
