<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="ocr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1219"/>
      <stop offset="1" stop-color="#0f1c28"/>
    </linearGradient>
    <pattern id="ocr-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none"/>
      <circle cx="0" cy="0" r="1" fill="#1c2d3e"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#ocr-bg)"/>
  <rect width="1200" height="675" fill="url(#ocr-grid)" opacity="0.6"/>

  <!-- Grid of pixel chars representing OCR output -->
  <g font-family="JetBrains Mono, monospace" font-size="48" font-weight="700" fill="#66fcf1" letter-spacing="6">
    <text x="80" y="120">DEED LET TYPE INVOICE 2026</text>
    <text x="80" y="190">CUSTOMER ID: 938-AX17-COD</text>
    <text x="80" y="260">AMOUNT 1,402,500 VND</text>
    <text x="80" y="330" opacity="0.85">DATE 2026-04-18 14:33:02</text>
  </g>

  <!-- The "broken" row: glitched OCR pass — some chars replaced with blocks -->
  <g font-family="JetBrains Mono, monospace" font-size="48" font-weight="700" fill="#ff9933" letter-spacing="6">
    <text x="80" y="420">BR█NCH HQ - SH█NHAN BAN█</text>
  </g>
  <g fill="#ff9933" opacity="0.55">
    <rect x="220" y="380" width="36" height="48"/>
    <rect x="640" y="380" width="36" height="48"/>
    <rect x="900" y="380" width="36" height="48"/>
  </g>

  <!-- Lower rows fading to noise -->
  <g font-family="JetBrains Mono, monospace" font-size="48" font-weight="700" fill="#66fcf1" opacity="0.45" letter-spacing="6">
    <text x="80" y="490">SIGNATURE: ░░▒▒▓▓ ░░▓▓</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="48" font-weight="700" fill="#66fcf1" opacity="0.22" letter-spacing="6">
    <text x="80" y="560">▒▒░░ ▓▓▒▒░ ▒░▒▓ ░▒▓▒░</text>
  </g>

  <!-- Caret cursor on bottom — engineer at work -->
  <g fill="#66fcf1">
    <rect x="80" y="600" width="14" height="36">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="110" y="630" font-family="JetBrains Mono, monospace" font-size="22" fill="#66fcf1" opacity="0.7">$ ./train --backbone v2 --hard-mining</text>
  </g>

  <!-- Amber accent corner brackets -->
  <g stroke="#ff9933" stroke-width="3" fill="none" opacity="0.7">
    <path d="M40 40 L40 80 M40 40 L80 40"/>
    <path d="M1160 40 L1160 80 M1160 40 L1120 40"/>
    <path d="M40 635 L40 595 M40 635 L80 635"/>
    <path d="M1160 635 L1160 595 M1160 635 L1120 635"/>
  </g>
</svg>
