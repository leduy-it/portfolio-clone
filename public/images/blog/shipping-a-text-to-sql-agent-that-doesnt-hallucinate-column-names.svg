<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sql-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1219"/>
      <stop offset="1" stop-color="#0f1c28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sql-bg)"/>

  <!-- Database table on left -->
  <g transform="translate(80,90)">
    <rect width="460" height="500" fill="#0e1a26" stroke="#66fcf1" stroke-width="2"/>
    <!-- Header row -->
    <rect width="460" height="48" fill="#66fcf1" opacity="0.12"/>
    <text x="20" y="32" font-family="JetBrains Mono, monospace" font-size="18" fill="#66fcf1" font-weight="700">stocks</text>
    <text x="200" y="32" font-family="JetBrains Mono, monospace" font-size="14" fill="#8c9cac">postgres / public</text>

    <!-- Column headers -->
    <g font-family="JetBrains Mono, monospace" font-size="14" fill="#66fcf1" font-weight="700">
      <text x="20" y="76">ticker</text>
      <text x="120" y="76">date</text>
      <text x="220" y="76">close</text>
      <text x="320" y="76">volume</text>
    </g>
    <line x1="0" y1="92" x2="460" y2="92" stroke="#1c2d3e" stroke-width="1"/>

    <!-- Rows -->
    <g font-family="JetBrains Mono, monospace" font-size="13" fill="#c4ccd6">
      <text x="20" y="120">VCB</text>
      <text x="120" y="120">2026-04</text>
      <text x="220" y="120">96.40</text>
      <text x="320" y="120">2.1M</text>

      <text x="20" y="156">FPT</text>
      <text x="120" y="156">2026-04</text>
      <text x="220" y="156">128.0</text>
      <text x="320" y="156">880K</text>

      <text x="20" y="192">HPG</text>
      <text x="120" y="192">2026-04</text>
      <text x="220" y="192">28.95</text>
      <text x="320" y="192">14.2M</text>

      <text x="20" y="228">MWG</text>
      <text x="120" y="228">2026-04</text>
      <text x="220" y="228">52.10</text>
      <text x="320" y="228">3.4M</text>
    </g>

    <!-- Highlighted column (amber) — schema-aware retrieval -->
    <rect x="200" y="92" width="100" height="200" fill="#ff9933" opacity="0.14"/>
    <rect x="200" y="60" width="100" height="32" fill="#ff9933" opacity="0.22"/>

    <!-- Faded extra rows -->
    <g font-family="JetBrains Mono, monospace" font-size="13" fill="#66fcf1" opacity="0.4">
      <text x="20" y="276">…</text>
      <text x="20" y="312">…</text>
    </g>
  </g>

  <!-- Arrow from table to SQL -->
  <g stroke="#66fcf1" stroke-width="3" fill="none">
    <path d="M580 280 Q 640 240 700 280" stroke-linecap="round"/>
    <polygon points="700,280 686,272 686,288" fill="#66fcf1"/>
  </g>

  <!-- SQL snippet on right -->
  <g transform="translate(700,160)">
    <rect width="430" height="320" fill="#12202d" stroke="#1c2d3e" stroke-width="2" rx="8"/>
    <g font-family="JetBrains Mono, monospace" font-size="16">
      <text x="20" y="42" fill="#ff9933">SELECT</text>
      <text x="100" y="42" fill="#c4ccd6">ticker, AVG(close)</text>
      <text x="20" y="74" fill="#ff9933">FROM</text>
      <text x="80" y="74" fill="#66fcf1">stocks</text>
      <text x="20" y="106" fill="#ff9933">WHERE</text>
      <text x="100" y="106" fill="#c4ccd6">date &gt;= </text>
      <text x="180" y="106" fill="#66fcf1">'2026-04-01'</text>
      <text x="20" y="138" fill="#ff9933">GROUP BY</text>
      <text x="140" y="138" fill="#c4ccd6">ticker</text>
      <text x="20" y="170" fill="#ff9933">ORDER BY</text>
      <text x="140" y="170" fill="#c4ccd6">2 DESC</text>
      <text x="20" y="202" fill="#ff9933">LIMIT</text>
      <text x="90" y="202" fill="#c4ccd6">10;</text>

      <text x="20" y="262" font-size="12" fill="#8c9cac" opacity="0.7">// schema-verified, no hallucinated columns</text>
      <text x="20" y="284" font-size="12" fill="#8c9cac" opacity="0.7">// 2nd-pass self-check: PASS</text>
    </g>
  </g>

  <!-- "agent" badge top-right -->
  <g transform="translate(1040,40)">
    <rect width="120" height="36" rx="18" fill="none" stroke="#66fcf1" stroke-width="2"/>
    <text x="60" y="24" font-family="JetBrains Mono, monospace" font-size="14" fill="#66fcf1" text-anchor="middle">agent: on</text>
  </g>
</svg>
