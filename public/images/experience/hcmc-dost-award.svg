<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="256" height="256">
  <rect width="16" height="16" fill="#0e1a26"/>
  <!-- Certificate ribbon star -->
  <g fill="#ff9933">
    <rect x="7"  y="2" width="2" height="1"/>
    <rect x="6"  y="3" width="4" height="1"/>
    <rect x="5"  y="4" width="6" height="2"/>
    <rect x="6"  y="6" width="1" height="1"/>
    <rect x="9"  y="6" width="1" height="1"/>
    <rect x="5"  y="7" width="2" height="1"/>
    <rect x="9"  y="7" width="2" height="1"/>
  </g>
  <!-- Star center -->
  <g fill="#0e1a26">
    <rect x="7" y="4" width="2" height="1"/>
    <rect x="8" y="5" width="1" height="1"/>
  </g>
  <!-- Saigon city silhouette below -->
  <g fill="#66fcf1">
    <rect x="2"  y="11" width="2" height="3"/>
    <rect x="4"  y="10" width="1" height="4"/>
    <rect x="5"  y="12" width="2" height="2"/>
    <rect x="7"  y="9"  width="1" height="5"/>
    <rect x="8"  y="11" width="2" height="3"/>
    <rect x="10" y="10" width="1" height="4"/>
    <rect x="11" y="12" width="2" height="2"/>
    <rect x="13" y="11" width="1" height="3"/>
  </g>
  <!-- Spire on tallest -->
  <rect x="7" y="8" width="1" height="1" fill="#ff9933"/>
</svg>
