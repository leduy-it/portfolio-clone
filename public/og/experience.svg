<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1c28"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#66fcf1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#66fcf1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="100%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff9933" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <!-- Brand mark -->
  <text x="48" y="60" font-family="monospace, system-ui" font-size="22" fill="#66fcf1" font-weight="700" letter-spacing="1">michael.py_</text>
  <line x1="48" y1="72" x2="160" y2="72" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.35"/>

  <!-- 6 company logo squares in 2 rows of 3 -->
  <!-- Row 1: y=130, squares at x=168, 420, 672 -->
  <!-- GrowtricsAI -->
  <rect x="168" y="130" width="200" height="140" rx="4" fill="#0f2a3a" stroke="#66fcf1" stroke-width="1.5" stroke-opacity="0.6" shape-rendering="crispEdges"/>
  <text x="268" y="185" font-family="monospace, system-ui" font-size="40" font-weight="700" fill="#66fcf1" text-anchor="middle">G</text>
  <text x="268" y="218" font-family="monospace, system-ui" font-size="11" fill="#66fcf1" text-anchor="middle" opacity="0.7" letter-spacing="1">GROWTRICS</text>
  <line x1="168" y1="270" x2="368" y2="270" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.25"/>

  <!-- GMO-Z -->
  <rect x="500" y="130" width="200" height="140" rx="4" fill="#1a1a0a" stroke="#ff9933" stroke-width="1.5" stroke-opacity="0.6" shape-rendering="crispEdges"/>
  <text x="600" y="185" font-family="monospace, system-ui" font-size="40" font-weight="700" fill="#ff9933" text-anchor="middle">Z</text>
  <text x="600" y="218" font-family="monospace, system-ui" font-size="11" fill="#ff9933" text-anchor="middle" opacity="0.7" letter-spacing="1">GMO-Z.COM</text>
  <line x1="500" y1="270" x2="700" y2="270" stroke="#ff9933" stroke-width="1" stroke-opacity="0.25"/>

  <!-- SmartPay -->
  <rect x="832" y="130" width="200" height="140" rx="4" fill="#0f2a3a" stroke="#66fcf1" stroke-width="1.5" stroke-opacity="0.6" shape-rendering="crispEdges"/>
  <text x="932" y="185" font-family="monospace, system-ui" font-size="40" font-weight="700" fill="#66fcf1" text-anchor="middle">S</text>
  <text x="932" y="218" font-family="monospace, system-ui" font-size="11" fill="#66fcf1" text-anchor="middle" opacity="0.7" letter-spacing="1">SMARTPAY</text>
  <line x1="832" y1="270" x2="1032" y2="270" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Row 2: decorative mini-squares -->
  <rect x="168" y="300" width="200" height="60" rx="2" fill="#0a1219" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.2" shape-rendering="crispEdges"/>
  <text x="268" y="337" font-family="monospace, system-ui" font-size="13" fill="#66fcf1" text-anchor="middle" opacity="0.5" letter-spacing="1">AI / OCR</text>

  <rect x="500" y="300" width="200" height="60" rx="2" fill="#0a1219" stroke="#ff9933" stroke-width="1" stroke-opacity="0.2" shape-rendering="crispEdges"/>
  <text x="600" y="337" font-family="monospace, system-ui" font-size="13" fill="#ff9933" text-anchor="middle" opacity="0.5" letter-spacing="1">RUNSYSTEM</text>

  <rect x="832" y="300" width="200" height="60" rx="2" fill="#0a1219" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.2" shape-rendering="crispEdges"/>
  <text x="932" y="337" font-family="monospace, system-ui" font-size="13" fill="#66fcf1" text-anchor="middle" opacity="0.5" letter-spacing="1">FINTECH</text>

  <!-- Separator -->
  <line x1="40" y1="395" x2="1160" y2="395" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Title -->
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Experience — what Duy has shipped</text>

  <!-- Subtitle -->
  <text x="600" y="500" font-family="monospace, system-ui" font-size="17" fill="#ff9933" text-anchor="middle" letter-spacing="1.5" opacity="0.85">GrowtricsAI · GMO-Z.com RUNSYSTEM · SmartPay JSC</text>

  <!-- Bottom-right slug -->
  <text x="1152" y="606" font-family="monospace, system-ui" font-size="15" fill="#66fcf1" text-anchor="end" opacity="0.65">leduy.py / experience</text>
</svg>
