<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1c28"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#66fcf1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#66fcf1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="100%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff9933" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <!-- Brand mark -->
  <text x="48" y="60" font-family="monospace, system-ui" font-size="22" fill="#66fcf1" font-weight="700" letter-spacing="1">michael.py_</text>
  <line x1="48" y1="72" x2="160" y2="72" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Large decorative company logo block (generic) -->
  <rect x="440" y="110" width="320" height="220" rx="6" fill="#0f2a3a" stroke="#66fcf1" stroke-width="1.5" stroke-opacity="0.5" shape-rendering="crispEdges"/>
  <!-- Corner accents -->
  <line x1="440" y1="110" x2="470" y2="110" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="440" y1="110" x2="440" y2="140" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="760" y1="110" x2="730" y2="110" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="760" y1="110" x2="760" y2="140" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="440" y1="330" x2="470" y2="330" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="440" y1="330" x2="440" y2="300" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="760" y1="330" x2="730" y2="330" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="760" y1="330" x2="760" y2="300" stroke="#66fcf1" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Pixel grid pattern inside box -->
  <g shape-rendering="crispEdges" opacity="0.3">
    <rect x="460" y="130" width="8" height="8" fill="#66fcf1"/>
    <rect x="476" y="130" width="8" height="8" fill="#66fcf1"/>
    <rect x="524" y="130" width="8" height="8" fill="#ff9933"/>
    <rect x="540" y="130" width="8" height="8" fill="#66fcf1"/>
    <rect x="588" y="130" width="8" height="8" fill="#66fcf1"/>
    <rect x="636" y="130" width="8" height="8" fill="#ff9933"/>
    <rect x="684" y="130" width="8" height="8" fill="#66fcf1"/>
    <rect x="700" y="130" width="8" height="8" fill="#66fcf1"/>
    <rect x="460" y="148" width="8" height="8" fill="#ff9933"/>
    <rect x="508" y="148" width="8" height="8" fill="#66fcf1"/>
    <rect x="556" y="148" width="8" height="8" fill="#66fcf1"/>
    <rect x="604" y="148" width="8" height="8" fill="#ff9933"/>
    <rect x="652" y="148" width="8" height="8" fill="#66fcf1"/>
    <rect x="700" y="148" width="8" height="8" fill="#66fcf1"/>
