  <!-- Central text in block -->
  <text x="600" y="210" font-family="monospace, system-ui" font-size="56" font-weight="700" fill="#66fcf1" text-anchor="middle" opacity="0.9">{ }</text>
  <text x="600" y="255" font-family="monospace, system-ui" font-size="13" fill="#ff9933" text-anchor="middle" letter-spacing="3" opacity="0.7">ENGINEER · BUILDER · SHIPPER</text>
  <line x1="490" y1="265" x2="710" y2="265" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="285" font-family="monospace, system-ui" font-size="11" fill="#66fcf1" text-anchor="middle" letter-spacing="2" opacity="0.5">HO CHI MINH CITY · VIETNAM</text>
  <text x="600" y="308" font-family="monospace, system-ui" font-size="11" fill="#66fcf1" text-anchor="middle" letter-spacing="1" opacity="0.4">OCR · DOCUMENT AI · LLM AGENTS</text>

  <!-- Separator -->
  <line x1="40" y1="365" x2="1160" y2="365" stroke="#66fcf1" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Title -->
  <text x="600" y="420" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">leduy.py / experience</text>

  <!-- Subtitle -->
  <text x="600" y="472" font-family="monospace, system-ui" font-size="17" fill="#ff9933" text-anchor="middle" letter-spacing="1" opacity="0.85">Long-form mission notes from a real shipping engineer</text>

  <!-- Bottom-right slug -->
  <text x="1152" y="606" font-family="monospace, system-ui" font-size="15" fill="#66fcf1" text-anchor="end" opacity="0.65">leduy.py / experience</text>
</svg>
